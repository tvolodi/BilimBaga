# nginx vhost — bilimbaga.ai-dala.com
# Install: sudo cp this file /etc/nginx/sites-available/bilimbaga.conf
#          sudo ln -s /etc/nginx/sites-available/bilimbaga.conf /etc/nginx/sites-enabled/
#          sudo nginx -t && sudo systemctl reload nginx
#
# HTTP → HTTPS redirect is handled at Cloudflare edge (always_use_https rule).
# This vhost handles only HTTPS traffic arriving from Cloudflare.

server {
    listen 443 ssl;
    server_name bilimbaga.ai-dala.com;

    # Cloudflare origin certificate — shared wildcard for *.ai-dala.com
    ssl_certificate     /etc/ssl/cloudflare/ai-dala.pem;
    ssl_certificate_key /etc/ssl/cloudflare/ai-dala.key;

    # FR-BB64 AC-3 / #95: must be >= the app's 10 MB upload cap (default is 1 MB).
    client_max_body_size 11m;

    # #475: the rate limits need the user's address, not Cloudflare's. Take the client from CF-Connecting-IP,
    # and trust it only from Cloudflare's published ranges (https://www.cloudflare.com/ips-v4/ and /ips-v6/;
    # re-check them when Cloudflare publishes changes).
    real_ip_header CF-Connecting-IP;
    set_real_ip_from 173.245.48.0/20;
    set_real_ip_from 103.21.244.0/22;
    set_real_ip_from 103.22.200.0/22;
    set_real_ip_from 103.31.4.0/22;
    set_real_ip_from 141.101.64.0/18;
    set_real_ip_from 108.162.192.0/18;
    set_real_ip_from 190.93.240.0/20;
    set_real_ip_from 188.114.96.0/20;
    set_real_ip_from 197.234.240.0/22;
    set_real_ip_from 198.41.128.0/17;
    set_real_ip_from 162.158.0.0/15;
    set_real_ip_from 104.16.0.0/13;
    set_real_ip_from 104.24.0.0/14;
    set_real_ip_from 172.64.0.0/13;
    set_real_ip_from 131.0.72.0/22;
    set_real_ip_from 2400:cb00::/32;
    set_real_ip_from 2606:4700::/32;
    set_real_ip_from 2803:f800::/32;
    set_real_ip_from 2405:b500::/32;
    set_real_ip_from 2405:8100::/32;
    set_real_ip_from 2a06:98c0::/29;
    set_real_ip_from 2c0f:f248::/32;

    location / {
        proxy_pass         http://127.0.0.1:3101;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }
}
