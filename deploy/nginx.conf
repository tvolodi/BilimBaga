server {
    listen 80;

    # AC-2 (FR-BB64): Security headers on every response.
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; font-src 'self';" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "same-origin" always;

    # HSTS only when HTTPS — prevents HSTS pinning over plain HTTP in development.
    if ($scheme = "https") {
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    }

    location /api/ {
        proxy_pass         http://api:8080;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location / {
        root  /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
    }
}
