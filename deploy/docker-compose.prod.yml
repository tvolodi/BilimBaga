services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - bilimbaga_prod_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  api:
    image: bilimbaga-api-prod:latest
    env_file: .env
    environment:
      DB_HOST: db
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      # #473: the image is FROM scratch (no shell, wget or curl), so the binary answers the check itself:
      # /app/api healthcheck GETs its own /api/v1/health on loopback (API_PORT, default 8080), exit 0 only on 200.
      # nginx keeps the short depends_on form on purpose: no service_healthy gate on the api.
      test: ["CMD", "/app/api", "healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  nginx:
    image: bilimbaga-prod:latest
    ports:
      - "127.0.0.1:3101:80"
    depends_on:
      - api
    restart: unless-stopped
    healthcheck:
      # #396: probes the API through the proxy, so it covers nginx and the /api/ path end to end.
      # The api image is FROM scratch (no shell, no health subcommand) and has no healthcheck of its own.
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "-T", "3", "http://127.0.0.1/api/v1/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  bilimbaga_prod_pgdata:
