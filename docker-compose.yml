services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "${HOST_DB_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER}"]
      interval: 5s
      timeout: 5s
      retries: 10
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "3"

  api:
    build: ./backend
    env_file: .env
    environment:
      # Container-internal port is fixed (nginx proxies to api:8080);
      # only the host mapping is configurable via BB_API_PORT.
      API_PORT: "8080"
    ports:
      - "${BB_API_PORT:-${HOST_API_PORT:-8080}}:8080"
    depends_on:
      db:
        condition: service_healthy
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "3"

  frontend:
    build:
      context: ./frontend
    volumes:
      - frontend_dist:/app/dist
    healthcheck:
      test: ["CMD", "test", "-f", "/app/dist/index.html"]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 5s
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "3"

  nginx:
    image: nginx:alpine
    ports:
      - "${HOST_HTTP_PORT:-80}:80"
    depends_on:
      api:
        condition: service_started
      frontend:
        condition: service_healthy
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - frontend_dist:/usr/share/nginx/html:ro
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "3"

  mailhog:
    image: mailhog/mailhog:v1.0.1
    ports:
      - "${HOST_MAILHOG_SMTP_PORT:-1025}:1025"  # SMTP
      - "${HOST_MAILHOG_UI_PORT:-8025}:8025"  # Web UI
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "3"

volumes:
  pgdata:
  frontend_dist:
