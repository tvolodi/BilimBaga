# AC-2 (FR-BB64): emit HSTS only when the original request was HTTPS (TLS is
# terminated upstream; this container only sees :80). An empty value makes
# nginx omit the header, avoiding HSTS pinning over plain HTTP in development.
map $http_x_forwarded_proto $hsts {
    default "";
    https   "max-age=31536000; includeSubDomains";
}

server {
    listen 80;

    # AC-2 (FR-BB64): Security headers on every response.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self';" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "same-origin" always;
    add_header Strict-Transport-Security $hsts always;

    # api:8080 is the container-internal port; BB_API_PORT only changes the host mapping.
    location /api/ {
        proxy_pass         http://api:8080;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location / {
        root  /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
    }
}
