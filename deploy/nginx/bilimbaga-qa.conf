# nginx vhost - bilimbaga-qa.ai-dala.com (QA instance, ISS-114 / #114)
# Install: sudo cp this file /etc/nginx/sites-available/bilimbaga-qa.conf
#          sudo ln -s /etc/nginx/sites-available/bilimbaga-qa.conf /etc/nginx/sites-enabled/
#          sudo nginx -t && sudo systemctl reload nginx
#
# Upstream: the QA compose stack (deploy/docker-compose.qa.yml) publishes
# 127.0.0.1:3114:80. Independent of the bilimbaga-test vhost (port 3111).
#
# HTTP -> HTTPS redirect is handled at the Cloudflare edge (always_use_https rule).
# This vhost handles only HTTPS traffic arriving from Cloudflare.

server {
    listen 443 ssl;
    server_name bilimbaga-qa.ai-dala.com;

    # Cloudflare origin certificate. The existing origin cert on the host is a
    # wildcard for *.ai-dala.com (same pattern as the test vhost), so it covers
    # this hostname. If infra issues a QA-specific cert instead, change these
    # two paths only. ASSUMPTION: confirm paths on the host before reload.
    ssl_certificate     /etc/ssl/cloudflare/ai-dala.pem;
    ssl_certificate_key /etc/ssl/cloudflare/ai-dala.key;

    # FR-BB64 AC-3 / #95: must be >= the app's 10 MB upload cap (default is 1 MB).
    client_max_body_size 11m;

    # #402: the edge enforces the same 11m limit first, so it must also answer 413 with the API
    # error envelope (see deploy/nginx.conf) instead of nginx's HTML page.
    error_page 413 @payload_too_large;
    location @payload_too_large {
        default_type application/json;
        add_header Cache-Control "no-store" always;
        return 413 '{"data":null,"error":{"code":"ERR_FILE_TOO_LARGE","message":"upload must not exceed 10 MB"}}';
    }

    location / {
        proxy_pass         http://127.0.0.1:3114;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }
}
