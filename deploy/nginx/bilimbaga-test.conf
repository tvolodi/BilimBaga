# nginx vhost — bilimbaga-test.ai-dala.com
# PROTECTED TARGET: customer demo, production-class (#107). Ops artifact for the human owner only;
# swarm roles must never install, change or deploy this.
# Exception, owner order 2026-10-10 (#419, #477): the error_page 413 handler, the CF-Connecting-IP real_ip
# block and the True-Client-IP clear below were added through a repo PR with an architect decision, and are
# deployed only in the window the owner confirms (nginx -t first, reload not restart, rollback ready).
# Install: sudo cp this file /etc/nginx/sites-available/bilimbaga-test.conf
#          sudo ln -s /etc/nginx/sites-available/bilimbaga-test.conf /etc/nginx/sites-enabled/
#          sudo nginx -t && sudo systemctl reload nginx
#
# HTTP → HTTPS redirect is handled at Cloudflare edge (always_use_https rule).
# This vhost handles only HTTPS traffic arriving from Cloudflare.

# #402 / api-conventions section 8: the size code and message depend on the endpoint, as the API's own
# 413s do. $uri is the path without the query string (users import is called with ?commit=true).
# Variable names are unique per vhost file: map variables share one http context on the host, so
# the same name in two vhosts fails nginx -t (duplicate variable). Use a different prefix elsewhere.
map $uri $bb_test_413_code {
    default                  ERR_FILE_TOO_LARGE;
    /api/v1/questions/import ERR_FILE_TOO_LARGE;
    /api/v1/users/import     FILE_TOO_LARGE;
    /api/v1/tenant/config    LOGO_TOO_LARGE;
}
map $uri $bb_test_413_msg {
    default                  "upload must not exceed 10 MB";
    /api/v1/questions/import "import file must not exceed 10 MB";
    /api/v1/users/import     "CSV file must not exceed 10 MB";
    /api/v1/tenant/config    "logo exceeds 2 MB limit";
}

server {
    listen 443 ssl;
    server_name bilimbaga-test.ai-dala.com;

    # Cloudflare origin certificate — shared wildcard for *.ai-dala.com
    ssl_certificate     /etc/ssl/cloudflare/ai-dala.pem;
    ssl_certificate_key /etc/ssl/cloudflare/ai-dala.key;

    # FR-BB64 AC-3 / #95: must be >= the app's 10 MB upload cap (default is 1 MB).
    client_max_body_size 11m;

    # #475: the rate limits need the user's address, not Cloudflare's. Take the client from CF-Connecting-IP,
    # and trust it only from Cloudflare's published ranges (https://www.cloudflare.com/ips-v4/ and /ips-v6/).
    # NOTE: this list needs a periodic comparison with those published lists, because Cloudflare changes them.
    # The drift check belongs in the infra health check (not implemented in this repo).
    real_ip_header CF-Connecting-IP;
    set_real_ip_from 173.245.48.0/20;
    set_real_ip_from 103.21.244.0/22;
    set_real_ip_from 103.22.200.0/22;
    set_real_ip_from 103.31.4.0/22;
    set_real_ip_from 141.101.64.0/18;
    set_real_ip_from 108.162.192.0/18;
    set_real_ip_from 190.93.240.0/20;
    set_real_ip_from 188.114.96.0/20;
    set_real_ip_from 197.234.240.0/22;
    set_real_ip_from 198.41.128.0/17;
    set_real_ip_from 162.158.0.0/15;
    set_real_ip_from 104.16.0.0/13;
    set_real_ip_from 104.24.0.0/14;
    set_real_ip_from 172.64.0.0/13;
    set_real_ip_from 131.0.72.0/22;
    set_real_ip_from 2400:cb00::/32;
    set_real_ip_from 2606:4700::/32;
    set_real_ip_from 2803:f800::/32;
    set_real_ip_from 2405:b500::/32;
    set_real_ip_from 2405:8100::/32;
    set_real_ip_from 2a06:98c0::/29;
    set_real_ip_from 2c0f:f248::/32;

    # #402: the edge enforces the same 11m limit first, so it must also answer 413 with the API
    # error envelope (see deploy/nginx.conf) instead of nginx's HTML page.
    error_page 413 @payload_too_large;
    location @payload_too_large {
        default_type application/json;
        add_header Cache-Control "no-store" always;
        return 413 '{"data":null,"error":{"code":"$bb_test_413_code","message":"$bb_test_413_msg"}}';
    }

    location / {
        proxy_pass         http://127.0.0.1:3111;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   True-Client-IP    "";   # #475: only X-Real-IP decides the client
    }
}
