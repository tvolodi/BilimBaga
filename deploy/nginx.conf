# #402 / api-conventions section 8: the size code and message depend on the endpoint, as the API's own
# 413s do. $uri is the path without the query string (users import is called with ?commit=true).
map $uri $too_large_code {
    default                  ERR_FILE_TOO_LARGE;
    /api/v1/questions/import ERR_FILE_TOO_LARGE;
    /api/v1/users/import     FILE_TOO_LARGE;
    /api/v1/tenant/config    LOGO_TOO_LARGE;
}
map $uri $too_large_msg {
    default                  "upload must not exceed 10 MB";
    /api/v1/questions/import "import file must not exceed 10 MB";
    /api/v1/users/import     "CSV file must not exceed 10 MB";
    /api/v1/tenant/config    "logo exceeds 2 MB limit";
}

# AC-2 (FR-BB64): emit HSTS only when the original request was HTTPS (TLS is
# terminated upstream; this container only sees :80). An empty value makes
# nginx omit the header, avoiding HSTS pinning over plain HTTP in development.
map $http_x_forwarded_proto $hsts {
    default "";
    https   "max-age=31536000; includeSubDomains";
}

server {
    listen 80;

    # #475/#481: the request reaches this container from the host's edge through the published port, so its
    # $remote_addr is the Docker network gateway (a private address), not the user. Trust X-Real-IP only from
    # private ranges. The edge sets X-Real-IP to the address it saw (the user behind Cloudflare, or the peer
    # itself), so $remote_addr becomes the user. X-Forwarded-For is not used: a client that reaches this container
    # from a private address could rotate it and choose its own address, and a recursive walk made that possible.
    # A public peer keeps its own address and cannot set X-Real-IP to pick one.
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    real_ip_header   X-Real-IP;

    # FR-BB64 AC-3 / #95: app caps uploads at 10 MB; allow a little headroom for
    # multipart overhead so nginx does not 413 (default 1 MB) before the app can respond.
    client_max_body_size 11m;

    # #402: above client_max_body_size nginx answers 413 itself with an HTML page. Return the
    # API error envelope instead ({data,error:{code,message}}, same code as the app's own 413 for
    # oversize imports). add_header is not inherited into a location that declares its own, so the
    # security headers are repeated in the named location.
    error_page 413 @payload_too_large;
    location @payload_too_large {
        default_type application/json;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self';" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "same-origin" always;
        add_header Strict-Transport-Security $hsts always;
        add_header Cache-Control "no-store" always;
        return 413 '{"data":null,"error":{"code":"$too_large_code","message":"$too_large_msg"}}';
    }

    # AC-2 (FR-BB64): Security headers on every response.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self';" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "same-origin" always;
    add_header Strict-Transport-Security $hsts always;

    # #511 (FR-BB65 AC-3, Lighthouse "enable text compression"): compress text responses. Applies to the SPA
    # shell and the hashed bundles; /api/ turns it off below. gzip_proxied any: the host's edge reaches this
    # container through a proxy hop and nginx must not skip compression because of it.
    gzip on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/json application/manifest+json image/svg+xml;

    # api:8080 is the container-internal port; BB_API_PORT only changes the host mapping.
    # #519: an insights answer waits for the provider for up to AI_TIMEOUT_SECONDS (at most 150 s). This location waits
    # 180 s, so the API answers before nginx cuts the request. ^~ makes it win over /api/ for this path only.
    location ^~ /api/v1/admin/ai/insights/ {
        proxy_pass         http://api:8080;
        proxy_read_timeout 180s;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   True-Client-IP "";
        gzip               off;
    }

    location /api/ {
        proxy_pass         http://api:8080;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        # #475: a client-sent True-Client-IP is passed through by default, and the API reads it first if
        # it is not cleared. An empty value drops the header, so only X-Real-IP above decides the client.
        proxy_set_header   True-Client-IP "";
        # #511: API bodies can carry per-user secrets next to attacker-influenced text, so they stay
        # uncompressed (BREACH); they are small, the win is in the static bundles.
        gzip               off;
    }

    # ISS-105: the reset link carries a one-time token in the query string. nginx add_header
    # directives are not inherited into a location that declares its own, so the security
    # headers are repeated here. The SPA is served for this path via try_files.
    location = /reset-password {
        root  /usr/share/nginx/html;
        try_files /index.html =404;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self';" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Strict-Transport-Security $hsts always;
        add_header Cache-Control "no-store" always;
    }

    # FR-BB321 AC-4: theme-init.js sets the theme before first paint, so a cached copy could apply a
    # stale switch value. no-cache makes the browser revalidate on every load. add_header is not
    # inherited into a location that declares its own, so the security headers are repeated here.
    location = /theme-init.js {
        root  /usr/share/nginx/html;
        try_files $uri =404;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self';" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "same-origin" always;
        add_header Strict-Transport-Security $hsts always;
        add_header Cache-Control "no-cache" always;
    }

    # #511 (Lighthouse "efficient cache policy"): Vite emits content-hashed files under /assets/, so a changed
    # file always gets a new URL and the old one can be cached for a year. try_files without the SPA fallback:
    # a missing hashed file must be a 404, never index.html served as JavaScript. add_header is not
    # inherited into a location that declares its own, so the security headers are repeated here.
    location /assets/ {
        root  /usr/share/nginx/html;
        try_files $uri =404;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self';" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "same-origin" always;
        add_header Strict-Transport-Security $hsts always;
        # No "always": the header is then sent only with 200/206/304, so a missing hashed file (404) is never
        # cached for a year by a browser or Cloudflare.
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # #461: the HTML shell (index.html, served for / and every SPA route) names the hashed bundles, so a
    # browser that keeps a stale copy after a deploy asks for assets that no longer exist. no-cache makes it
    # revalidate on every load (an ETag answer is a cheap 304). Repeats the security headers for the same reason.
    location / {
        root  /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self';" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "same-origin" always;
        add_header Strict-Transport-Security $hsts always;
        add_header Cache-Control "no-cache" always;
    }
}
