name: docker-build

# ISS-127: the Docker images must build from the exact contexts compose uses.
# Catches files that only exist outside frontend/ or backend/ (e.g. tsc importing ../scripts).
# Build only: nothing is pushed or run.
on:
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - "backend/**"
      - "scripts/**"
      - "deploy/**"
      - "**/Dockerfile"
      - ".github/workflows/docker-build.yml"
  pull_request:
    paths:
      - "frontend/**"
      - "backend/**"
      - "scripts/**"
      - "deploy/**"
      - "**/Dockerfile"
      - ".github/workflows/docker-build.yml"

permissions:
  contents: read

jobs:
  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build frontend image (context ./frontend)
        run: docker build -t bilimbaga-frontend:ci ./frontend
      - name: Build api image (context ./backend)
        run: docker build -t bilimbaga-api:ci ./backend
      - name: Build deploy image (context repo root)
        run: docker build -f deploy/Dockerfile -t bilimbaga-deploy:ci .

  # retro-003: PRs touching scripts/, frontend/e2e, Dockerfile or deploy/ must at least
  # load every Playwright spec (catches import/type errors); lists only, no browsers.
  playwright-list:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx playwright test --list
