# QA instance (bilimbaga-qa.ai-dala.com). Shares nothing with the bilimbaga-test instance:
# own compose project, images, volume, network, containers, host port and APP_DIR.
name: bilimbaga-qa

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - bilimbaga_qa_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  api:
    image: bilimbaga-api-qa:latest
    env_file: .env
    environment:
      DB_HOST: db
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  nginx:
    image: bilimbaga-qa:latest
    ports:
      - "127.0.0.1:3114:80"
    depends_on:
      - api
    restart: unless-stopped

volumes:
  bilimbaga_qa_pgdata:
