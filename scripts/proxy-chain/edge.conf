# #484: the edge of the chain test. Its location block mirrors deploy/nginx/bilimbaga-qa.conf, so the header rules
# are the same as in production: X-Real-IP is the address the edge saw (replacing any the client sent), the
# forwarded chain is appended, and True-Client-IP is dropped. Only the upstream differs (the container nginx service).
server {
    listen 80;
    client_max_body_size 11m;

    location / {
        proxy_pass         http://nginx:80;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   True-Client-IP    "";
    }
}
