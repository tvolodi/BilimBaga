name: tests

# ISS-233: unit/integration tests, static analysis and type checks on every PR and on main.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16
        env:
          # Throwaway credentials for the ephemeral CI service container only.
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: bilimbaga_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d bilimbaga_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://ci:ci@localhost:5432/bilimbaga_test?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache: true
          cache-dependency-path: backend/go.sum
      - name: go vet
        run: go vet ./...
      - name: Install staticcheck
        run: go install honnef.co/go/tools/cmd/staticcheck@v0.8.1
      - name: staticcheck
        run: staticcheck ./...
      - name: go test
        if: ${{ !cancelled() }}
        run: go test -p 2 ./...
      - name: Sign-in limiter script refuses a non-local base (#484)
        run: bash ../scripts/tests/test-limiter-forwarded-headers_test.sh

  frontend-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    env:
      CI: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Type check
        run: npx tsc --noEmit
      - name: Lint
        run: npm run lint
      - name: i18n key check
        run: npm run check:i18n
      - name: Design-system check (FR-BB320 AC-6, AC-7)
        run: npm run check:design
      - name: Unit tests
        run: npx vitest run
      - name: Build
        run: npm run build
      - name: Bundle budget (FR-BB65, #200)
        run: bash ../scripts/perf/bundle-check.sh

  swarm-tests:
    # #423: the swarm shell tests run on every PR and on main, so a broken swarm script cannot merge unnoticed.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Swarm shell tests
        run: |
          fail=0
          for t in swarm/tests/*.sh; do
            echo "::group::$t"
            bash "$t" || { echo "::error::$t failed"; fail=1; }
            echo "::endgroup::"
          done
          exit $fail

  swarm-tests-windows:
    # #423: the PowerShell swarm tests need Windows PowerShell and Scheduled Tasks, so they run on a Windows runner.
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Swarm PowerShell tests
        shell: pwsh
        run: |
          foreach ($t in Get-ChildItem swarm/tests/*.ps1) {
            powershell -NoProfile -ExecutionPolicy Bypass -File $t.FullName
            if ($LASTEXITCODE -ne 0) { throw "$($t.Name) failed" }
          }
